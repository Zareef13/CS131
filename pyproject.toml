[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risksight"
version = "0.1.0"
description = "Classical computer vision pipeline for obstacle-awareness overlays in FPV drone video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
ai = ["google-genai"]
annotation = ["google-genai", "torch", "transformers", "pillow"]

[project.scripts]
risksight = "risksight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
